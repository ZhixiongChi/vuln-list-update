name: Update vuln-list-elxr repo
on:
  schedule:
  - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update vuln-list-elxr
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ELXR_REPO_TOKEN }}
      VULN_LIST_DIR: "vuln-list-elxr"
    steps:
    - name: Check out code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Set up Go
      uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
      with:
        go-version-file: go.mod

    - name: Check out vuln-list-elxr repo
      uses: actions/checkout@v5
      with:
        repository: ${{ github.repository_owner }}/${{ env.VULN_LIST_DIR }}
        token: ${{ secrets.ELXR_REPO_TOKEN }}
        path: ${{ env.VULN_LIST_DIR }}

    - name: Setup github user email and name
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Compile vuln-list-update
      run: go build -o vuln-list-update .

    - if: always()
      name: eLxr Security Bug Tracker
      run: ./scripts/update.sh elxr "eLxr Security Bug Tracker"
